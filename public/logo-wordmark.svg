<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" width="760" height="128" fill="none" role="img" aria-label="CommitmentLedger v2.2 wordmark">
  <defs>
    <linearGradient id="cl-wm-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="58%" stop-color="#0f2544" />
      <stop offset="100%" stop-color="#164777" />
    </linearGradient>
    <linearGradient id="cl-wm-tick" x1="23" y1="45" x2="47" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fa3d1" />
      <stop offset="100%" stop-color="#9ad7f8" />
    </linearGradient>
  </defs>

  <!-- Standalone Mark -->
  <g transform="translate(2, 0)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#cl-wm-bg)" stroke="#4fa3d1" stroke-width="1.5" stroke-opacity="0.45" />
    <rect x="8.5" y="8.5" width="47" height="47" rx="11" stroke="#ffffff" stroke-width="1.25" stroke-opacity="0.22" />
    <line x1="18.5" y1="17.5" x2="18.5" y2="45.5" stroke="#4fa3d1" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="24.5" y1="20.5" x2="39.5" y2="20.5" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />
    <line x1="24.5" y1="28.5" x2="35" y2="28.5" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.82" />
    <path d="M24 38.5L30.8 45.2L46.5 27.5" stroke="url(#cl-wm-tick)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="20.5" r="2.2" fill="#4fa3d1" />
  </g>

  <!-- Editorial Wordmark Lockup -->
  <text x="76" y="43" fill="#0a0a0a" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" font-weight="600" letter-spacing="-1.6">CommitmentLedger</text>
  <text x="336" y="25" fill="#164777" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" letter-spacing="-0.4">v2.2</text>
</svg>
